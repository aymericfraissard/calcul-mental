<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tests du générateur — Calcul mental</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/storage.js"></script>
  <script src="js/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1 class="site-title">Calcul mental · Tests</h1>
      <a class="theme-toggle" href="index.html">Retour à l'application</a>
    </div>
  </header>

  <main class="container">
    <section class="card" aria-labelledby="tests-title">
      <h2 class="card-title" id="tests-title">Générateur de questions</h2>
      <p class="test-summary" id="summary" role="status">Exécution des tests…</p>
      <table class="table">
        <thead>
          <tr>
            <th scope="col">Opération</th>
            <th scope="col">Difficulté</th>
            <th scope="col">Questions</th>
            <th scope="col">Exemple</th>
            <th scope="col">Statut</th>
          </tr>
        </thead>
        <tbody id="results"></tbody>
      </table>
      <ul class="test-failures" id="failures" hidden></ul>
    </section>

    <section class="card" aria-labelledby="stats-tests-title">
      <h2 class="card-title" id="stats-tests-title">Barème, chronomètre et statistiques</h2>
      <p class="test-summary" id="stats-summary" role="status">Exécution des tests…</p>
      <table class="table">
        <thead>
          <tr>
            <th scope="col">Vérification</th>
            <th scope="col">Statut</th>
          </tr>
        </thead>
        <tbody id="stats-results"></tbody>
      </table>
    </section>
  </main>

  <script src="js/generator.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/charts.js"></script>
  <script>
    /* Tests du générateur : 1000 questions par combinaison opération × difficulté. */
    (function () {
      'use strict';

      const N = 1000;
      const OPERATIONS = ['add', 'sub', 'mul', 'div'];
      const DIFFICULTIES = ['facile', 'moyen', 'difficile'];
      const SYMBOLS = { add: '+', sub: '−', mul: '×', div: '÷' };
      const LABELS = { add: 'Addition', sub: 'Soustraction', mul: 'Multiplication', div: 'Division', mix: 'Mixte (les 4)' };
      const MAX_LISTED_FAILURES = 30;

      // Bornes du cahier des charges, recopiées ici volontairement
      // (indépendantes de generator.js pour que le test ait un sens).
      const SPEC = {
        facile:    { addSub: [1, 20],   mul: [[1, 5], [1, 10]],  divisor: [1, 5],  quotientMax: 5,  negative: false },
        moyen:     { addSub: [10, 100], mul: [[2, 10], [2, 10]], divisor: [2, 10], quotientMax: 10, negative: false },
        difficile: { addSub: [50, 999], mul: [[2, 20], [2, 20]], divisor: [2, 15], quotientMax: 20, negative: true }
      };

      const failures = [];
      let totalQuestions = 0;
      let totalGroups = 0;
      let failedGroups = 0;

      function inRange(value, range) {
        return value >= range[0] && value <= range[1];
      }

      function expectedAnswer(q) {
        switch (q.op) {
          case 'add': return q.a + q.b;
          case 'sub': return q.a - q.b;
          case 'mul': return q.a * q.b;
          case 'div': return q.a / q.b;
          default: return NaN;
        }
      }

      /** Renvoie la liste des problèmes détectés sur une question. */
      function checkQuestion(q, expectedOp, difficulty) {
        const errors = [];
        const spec = SPEC[difficulty];
        if (expectedOp && q.op !== expectedOp) errors.push('opération inattendue « ' + q.op + ' »');
        if (q.symbol !== SYMBOLS[q.op]) errors.push('symbole incorrect « ' + q.symbol + ' »');
        if (![q.a, q.b, q.answer].every(Number.isInteger)) errors.push('valeur non entière');
        if (q.answer !== expectedAnswer(q)) errors.push('réponse fausse (' + q.answer + ')');

        if (q.op === 'add' || q.op === 'sub') {
          if (!inRange(q.a, spec.addSub) || !inRange(q.b, spec.addSub)) errors.push('nombres hors bornes');
        }
        if (q.op === 'sub' && !spec.negative && q.answer < 0) errors.push('soustraction négative');
        if (q.op === 'mul') {
          const t = spec.mul[0];
          const f = spec.mul[1];
          const ok = (inRange(q.a, t) && inRange(q.b, f)) || (inRange(q.a, f) && inRange(q.b, t));
          if (!ok) errors.push('facteurs hors bornes');
        }
        if (q.op === 'div') {
          if (q.b === 0) errors.push('division par 0');
          else if (q.a % q.b !== 0) errors.push('division non entière');
          if (!inRange(q.b, spec.divisor)) errors.push('diviseur hors bornes');
          if (!inRange(q.answer, [1, spec.quotientMax])) errors.push('résultat hors bornes');
        }
        return errors;
      }

      function describe(q) {
        return q.a + ' ' + q.symbol + ' ' + q.b + ' = ' + q.answer;
      }

      /** Génère N questions pour un groupe et vérifie chacune d'elles. */
      function runGroup(operations, expectedOp, difficulty, name) {
        let groupFailures = 0;
        let previousKey = null;
        let sample = null;
        const seenOps = {};
        Generator.reset();

        for (let i = 0; i < N; i++) {
          const q = generateQuestion(operations, difficulty);
          const key = q.op + ':' + q.a + ':' + q.b;
          const errors = checkQuestion(q, expectedOp, difficulty);
          if (key === previousKey) errors.push('même calcul deux fois de suite');
          if (errors.length > 0) {
            groupFailures += 1;
            failures.push(LABELS[name] + ' / ' + difficulty + ' : ' + describe(q) + ' → ' + errors.join(', '));
          }
          previousKey = key;
          seenOps[q.op] = true;
          if (!sample) sample = q;
        }

        // En mode mixte, chaque opération doit apparaître au moins une fois
        operations.forEach(function (op) {
          if (!seenOps[op]) {
            groupFailures += 1;
            failures.push(LABELS[name] + ' / ' + difficulty + ' : l\'opération ' + op + ' n\'apparaît jamais');
          }
        });

        totalQuestions += N;
        totalGroups += 1;
        if (groupFailures > 0) failedGroups += 1;
        addRow(LABELS[name], difficulty, sample, groupFailures);
      }

      /** Les paramètres invalides doivent lever une erreur. */
      function runValidationTests() {
        const invalidCalls = [
          { args: [[], 'facile'], label: 'liste d\'opérations vide' },
          { args: [['pow'], 'facile'], label: 'opération inconnue' },
          { args: [['add'], 'expert'], label: 'difficulté inconnue' }
        ];
        let groupFailures = 0;
        invalidCalls.forEach(function (call) {
          try {
            generateQuestion(call.args[0], call.args[1]);
            groupFailures += 1;
            failures.push('Validation : aucune erreur levée pour ' + call.label);
          } catch (error) {
            /* attendu */
          }
        });
        totalGroups += 1;
        if (groupFailures > 0) failedGroups += 1;
        addRow('Paramètres invalides', '—', null, groupFailures, invalidCalls.length + ' appels');
      }

      function addRow(operation, difficulty, sample, failureCount, countLabel) {
        const row = document.createElement('tr');
        const cells = [
          operation,
          difficulty,
          countLabel || String(N),
          sample ? describe(sample) : '—',
          failureCount === 0 ? 'OK' : failureCount + ' échec(s)'
        ];
        cells.forEach(function (text, index) {
          const cell = document.createElement('td');
          cell.textContent = text;
          if (index === cells.length - 1) cell.className = failureCount === 0 ? 'is-right' : 'is-wrong';
          row.appendChild(cell);
        });
        document.getElementById('results').appendChild(row);
      }

      function showSummary() {
        const summary = document.getElementById('summary');
        const ok = failedGroups === 0;
        summary.className = 'test-summary ' + (ok ? 'is-correct' : 'is-wrong');
        summary.textContent = ok
          ? 'Tous les tests sont passés : ' + totalGroups + ' groupes, ' + totalQuestions.toLocaleString('fr-FR') + ' questions vérifiées.'
          : failedGroups + ' groupe(s) en échec sur ' + totalGroups + ' (' + failures.length + ' problème(s) détecté(s)).';

        const list = document.getElementById('failures');
        failures.slice(0, MAX_LISTED_FAILURES).forEach(function (text) {
          const item = document.createElement('li');
          item.textContent = text;
          list.appendChild(item);
        });
        list.hidden = failures.length === 0;
        // Exposé pour une vérification automatisée éventuelle
        window.testResults = { ok: ok, groups: totalGroups, questions: totalQuestions, failures: failures.slice() };
      }

      DIFFICULTIES.forEach(function (difficulty) {
        OPERATIONS.forEach(function (op) {
          runGroup([op], op, difficulty, op);
        });
        runGroup(OPERATIONS, null, difficulty, 'mix');
      });
      runValidationTests();
      showSummary();
    })();
  </script>
  <script>
    /* Tests du barème, du chronomètre et des statistiques (fonctions pures). */
    (function () {
      'use strict';

      const checks = [];

      /** Une vérification : la fonction renvoie true, ou un message d'échec. */
      function check(name, fn) {
        let result;
        try {
          result = fn();
        } catch (error) {
          result = 'exception : ' + error.message;
        }
        checks.push({ name: name, ok: result === true, detail: result === true ? '' : String(result) });
      }

      function same(actual, expected) {
        const a = JSON.stringify(actual);
        const e = JSON.stringify(expected);
        return a === e ? true : 'obtenu ' + a + ', attendu ' + e;
      }

      function near(actual, expected) {
        return Math.abs(actual - expected) < 1e-9 ? true : 'obtenu ' + actual + ', attendu ' + expected;
      }

      function q(op) {
        return { op: op };
      }

      /** Partie enregistrée fictive (format v2). */
      function game(date, difficulty, operations, ops, extra) {
        const record = {
          v: 2, date: date, operations: operations, difficulty: difficulty, mode: 'serie', count: 10,
          correct: 0, total: 0, ms: 0, bestStreak: 0, ops: ops
        };
        Object.keys(ops).forEach(function (op) {
          record.correct += ops[op].c;
          record.total += ops[op].n;
          record.ms += ops[op].ms;
        });
        return Object.assign(record, extra || {});
      }

      function counters(n, c, ms, pts, tiers) {
        return { n: n, c: c, ms: ms, pts: pts, tiers: tiers };
      }

      /** Ancienne partie : score seulement. */
      function legacy(date, difficulty, operations, correct, total) {
        return {
          v: 1, date: date, operations: operations, difficulty: difficulty, mode: 'serie', count: total,
          correct: correct, total: total, ms: null, bestStreak: null, ops: null
        };
      }

      /* ---------- Barème ---------- */

      check('Barème : points 20 / 16 / 12 / 8 / 4 / 0', function () {
        return same(Stats.TIERS.map(function (t) { return t.points; }), [20, 16, 12, 8, 4, 0]);
      });

      check('Barème : seuils inclus et arrondi au dixième affiché', function () {
        const cases = [[0, 0], [2999, 0], [3000, 0], [3049, 0], [3050, 1], [5000, 1], [5049, 1],
          [5050, 2], [10000, 2], [10050, 3], [15000, 3], [30000, 4], [30049, 4], [30050, 5], [600000, 5]];
        const wrong = cases.filter(function (c) { return Stats.tierIndex(c[0]) !== c[1]; });
        return wrong.length === 0 ? true : 'paliers faux pour ' + wrong.map(function (c) { return c[0] + ' ms'; }).join(', ');
      });

      check('Note : aucune bonne réponse = pas de note', function () {
        return same(Stats.speedNote(0, 0), null);
      });

      /* ---------- Enregistrement d'une partie ---------- */

      const built = Stats.buildGameRecord(
        { operations: ['add', 'mul'], difficulty: 'moyen', mode: 'serie', count: 3 },
        [
          { question: q('add'), ms: 2000, isCorrect: true },
          { question: q('add'), ms: 4000, isCorrect: false },
          { question: q('mul'), ms: 6000.4, isCorrect: true }
        ],
        1,
        '2026-11-18T10:00:00.000Z'
      );

      check('Partie : score, total et temps cumulés', function () {
        return same([built.correct, built.total, built.ms, built.bestStreak], [2, 3, 12000, 1]);
      });

      check('Partie : compteurs par opération', function () {
        return same(built.ops, {
          add: counters(2, 1, 6000, 20, [1, 0, 0, 0, 0, 0]),
          mul: counters(1, 1, 6000, 12, [0, 0, 1, 0, 0, 0])
        });
      });

      check('Partie : note = moyenne des points des bonnes réponses', function () {
        const totals = Stats.totalsOf(built);
        return near(Stats.speedNote(totals.pts, totals.c), 16);
      });

      /* ---------- Filtres et agrégats ---------- */

      const games = [
        legacy('2026-11-01T09:00:00.000Z', 'facile', ['add'], 8, 10),
        legacy('2026-11-02T09:00:00.000Z', 'moyen', ['add', 'mul'], 5, 10),
        game('2026-11-03T09:00:00.000Z', 'facile', ['add'], { add: counters(10, 9, 30000, 160, [5, 3, 1, 0, 0, 0]) }, { bestStreak: 6 }),
        game('2026-11-04T09:00:00.000Z', 'moyen', ['add', 'mul'], {
          add: counters(5, 4, 25000, 48, [0, 2, 1, 1, 0, 0]),
          mul: counters(5, 5, 10000, 100, [5, 0, 0, 0, 0, 0])
        }, { bestStreak: 9 })
      ];

      check('Filtre : toutes les parties', function () {
        return same(Stats.select(games, { difficulty: 'all', op: 'all' }).length, 4);
      });

      check('Filtre : difficulté', function () {
        return same(Stats.select(games, { difficulty: 'facile', op: 'all' }).map(function (s) { return s.game.date.slice(8, 10); }), ['01', '03']);
      });

      check('Filtre : opération (anciennes parties mixtes exclues)', function () {
        const add = Stats.select(games, { difficulty: 'all', op: 'add' });
        const mul = Stats.select(games, { difficulty: 'all', op: 'mul' });
        return same([add.length, mul.length, mul[0].n, mul[0].c], [3, 1, 5, 5]);
      });

      check('Synthèse : réussite sur tout, temps et note sur les parties chronométrées', function () {
        const s = Stats.summarize(Stats.select(games, { difficulty: 'all', op: 'all' }));
        const errors = [];
        if (s.questions !== 40 || s.correct !== 31) errors.push('questions/correctes ' + s.questions + '/' + s.correct);
        if (Math.abs(s.rate - 31 / 40) > 1e-9) errors.push('réussite ' + s.rate);
        if (Math.abs(s.avgMs - 65000 / 20) > 1e-9) errors.push('temps moyen ' + s.avgMs);
        if (Math.abs(s.note - 308 / 18) > 1e-9) errors.push('note ' + s.note);
        if (s.bestStreak !== 9) errors.push('meilleure série ' + s.bestStreak);
        return errors.length === 0 ? true : errors.join(', ');
      });

      check('Évolution : une valeur par partie, null si inconnue', function () {
        const slices = Stats.select(games, { difficulty: 'all', op: 'all' });
        const time = Stats.evolution(slices, 'time').map(function (p) { return p.value; });
        return same(time, [null, null, 3, 3.5]);
      });

      check('Moyenne glissante sur 5 parties (trous ignorés)', function () {
        return same(Stats.movingAverage([10, null, 20, 30, 40, 50, 60], 5), [10, null, 15, 20, 25, 35, 40]);
      });

      check('Activité : questions par jour (heure locale)', function () {
        const day = function (d, h) { return new Date(2026, 10, d, h).toISOString(); };
        const slices = Stats.select([
          game(day(10, 9), 'facile', ['add'], { add: counters(10, 10, 1, 0, [0, 0, 0, 0, 0, 0]) }),
          game(day(16, 23), 'facile', ['add'], { add: counters(20, 10, 1, 0, [0, 0, 0, 0, 0, 0]) }),
          game(day(18, 0), 'facile', ['add'], { add: counters(10, 10, 1, 0, [0, 0, 0, 0, 0, 0]) }),
          game(day(18, 9), 'facile', ['add'], { add: counters(5, 5, 1, 0, [0, 0, 0, 0, 0, 0]) })
        ], { difficulty: 'all', op: 'all' });
        const result = Stats.activity(slices, 3, new Date(2026, 10, 18, 12));
        return same(result.map(function (d) { return [d.key, d.questions, d.games]; }),
          [['2026-11-16', 20, 1], ['2026-11-17', 0, 0], ['2026-11-18', 15, 2]]);
      });

      check('Par opération : une ligne par opération jouée', function () {
        const rows = Stats.byOperation(games, { difficulty: 'all', op: 'all' });
        return same(rows.map(function (r) { return [r.op, r.questions]; }), [['add', 25], ['mul', 5]]);
      });

      check('Paliers : bonnes réponses chronométrées seulement', function () {
        return same(Stats.tierCounts(Stats.select(games, { difficulty: 'all', op: 'all' })), [10, 5, 2, 1, 0, 0]);
      });

      /* ---------- Records ---------- */

      check('Clé de configuration : sans le temps, opérations triées', function () {
        return same(Stats.configKey({ operations: ['mul', 'add'], difficulty: 'moyen', mode: 'serie', count: 20 }),
          'ops=add+mul|diff=moyen|mode=serie-20');
      });

      check('Record : plus de bonnes réponses, ou à égalité un temps moyen plus court', function () {
        const base = { correct: 8, total: 10, ms: 30000 };
        const errors = [];
        if (Stats.isBetter({ correct: 0, total: 10, ms: 1 }, null)) errors.push('0 bonne réponse compté comme record');
        if (!Stats.isBetter({ correct: 1, total: 10, ms: 1 }, null)) errors.push('premier score non retenu');
        if (!Stats.isBetter({ correct: 9, total: 10, ms: 90000 }, base)) errors.push('meilleur score refusé');
        if (!Stats.isBetter({ correct: 8, total: 10, ms: 20000 }, base)) errors.push('égalité plus rapide refusée');
        if (Stats.isBetter({ correct: 8, total: 10, ms: 30000 }, base)) errors.push('égalité stricte acceptée');
        if (Stats.isBetter({ correct: 8, total: 10, ms: null }, base)) errors.push('temps inconnu accepté');
        return errors.length === 0 ? true : errors.join(', ');
      });

      check('Records : un par configuration', function () {
        const list = Stats.records(games.concat([
          game('2026-11-05T09:00:00.000Z', 'facile', ['add'], { add: counters(10, 10, 20000, 200, [10, 0, 0, 0, 0, 0]) })
        ]));
        // Deux configurations : Facile + (01, 03, 05) et Moyen + × (02, 04)
        return same(list.map(function (g) { return g.date.slice(8, 10); }), ['05', '04']);
      });

      /* ---------- Chronomètre ---------- */

      check('Chronomètre : temps écoulé, pause et reprise', function () {
        let fake = 1000;
        const hadOwn = Object.prototype.hasOwnProperty.call(performance, 'now');
        performance.now = function () { return fake; };
        try {
          const steps = [];
          Timer.start();
          fake = 3000; steps.push(Timer.elapsed());
          Timer.pause();
          fake = 10000; steps.push(Timer.elapsed());
          Timer.resume();
          fake = 10500; steps.push(Timer.elapsed());
          Timer.stop();
          fake = 20000; steps.push(Timer.elapsed(), Timer.isActive());
          return same(steps, [2000, 2000, 2500, 2500, false]);
        } finally {
          if (!hadOwn) delete performance.now;
        }
      });

      /* ---------- Formatage et échelles ---------- */

      check('Formatage français des durées et libellés', function () {
        return same([
          Ui.formatSeconds(2440),
          Ui.formatPercent(0.724),
          Ui.formatTotalTime(45000),
          Ui.formatTotalTime(3900000),
          Ui.formatConfigLabel({ operations: ['add', 'mul'], difficulty: 'moyen', mode: 'serie', count: 20 })
        ], ['2,4 s', '72 %', '45 s', '1 h 05', 'Mixte + × · Moyen · Série de 20']);
      });

      check('Échelles : graduations rondes, entières pour des quantités', function () {
        return same([Charts.niceScale(7, 3, true), Charts.niceScale(4.3, 4, false)],
          [{ max: 10, ticks: [0, 5, 10] }, { max: 6, ticks: [0, 2, 4, 6] }]);
      });

      /* ---------- Affichage ---------- */

      const body = document.getElementById('stats-results');
      checks.forEach(function (item) {
        const row = document.createElement('tr');
        const name = document.createElement('td');
        name.textContent = item.name;
        const status = document.createElement('td');
        status.textContent = item.ok ? 'OK' : 'Échec : ' + item.detail;
        status.className = item.ok ? 'is-right' : 'is-wrong';
        row.appendChild(name);
        row.appendChild(status);
        body.appendChild(row);
      });

      const failed = checks.filter(function (item) { return !item.ok; });
      const summary = document.getElementById('stats-summary');
      summary.className = 'test-summary ' + (failed.length === 0 ? 'is-correct' : 'is-wrong');
      summary.textContent = failed.length === 0
        ? 'Toutes les vérifications sont passées (' + checks.length + ').'
        : failed.length + ' vérification(s) en échec sur ' + checks.length + '.';

      window.statsTestResults = {
        ok: failed.length === 0,
        count: checks.length,
        failures: failed.map(function (item) { return item.name + ' → ' + item.detail; })
      };
    })();
  </script>
</body>
</html>
